name: MicroGen reliability regressions

on:
  pull_request:
    paths:
      - 'selenium_pipeline/**'
      - 'tests/**'
      - 'schemas/**'
      - 'docs/**'
      - 'prompts/**'
      - 'README.md'
      - 'gen_video*.py'
      - 'microgen_batch.py'
      - '.github/workflows/**'
  push:
    branches: [main]

jobs:
  offline-regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal offline test dependencies
        run: python -m pip install selenium pymupdf pypdf pillow imageio-ffmpeg jsonschema 'sympy>=1.13,<2' 'google-genai>=2.25,<3'
      - name: Verify known historical failure protections
        shell: pwsh
        run: |
          $regressionModules = @(
            "tests.test_browser_port_lock"
            "tests.test_gemini_mode_recovery"
