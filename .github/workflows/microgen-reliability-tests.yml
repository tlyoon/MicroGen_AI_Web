  full-regressions:
    name: Full offline suite (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install selenium pymupdf pypdf pillow imageio-ffmpeg pytest jsonschema opencv-python-headless 'sympy>=1.13,<2' 'google-genai>=2.25,<3'
      - name: Full historical and Stage 3 fault-injection regression suite
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          PYTHONNOUSERSITE: '1'
        run: python -m pytest -q tests selenium_pipeline/tests --basetemp=.pytest-stage3-isolated --disable-warnings --maxfail=1
